<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Central Vitor</title>
  <meta name="description" content="Central Vitor — em breve.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1b2a4a, #0a0f1c);
      color: #e8eefc;
      overflow: hidden;
    }
    .card {
      text-align: center;
      padding: 48px 28px;
      max-width: 560px;
      animation: rise .7s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid #2c63ff55;
      border-radius: 999px;
      color: #8fb0ff;
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      font-size: clamp(36px, 8vw, 64px);
      margin: 18px 0 12px;
      font-weight: 800;
      background: linear-gradient(90deg, #7aa2ff, #c9d6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { color: #a9b6d4; font-size: 18px; line-height: 1.55; }
    .status {
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 999px;
      background: #0f1830;
      border: 1px solid #1e2c4f;
      font-size: 15px;
      color: #cdd8f3;
    }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #36d399;
      box-shadow: 0 0 0 0 #36d39966;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 #36d39966; }
      70% { box-shadow: 0 0 0 12px #36d39900; }
      100% { box-shadow: 0 0 0 0 #36d39900; }
    }
    .foot { margin-top: 28px; color: #5f6f93; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">vitoroliv.com</span>
    <h1>Central Vitor</h1>
    <p>Estamos preparando tudo por aqui.<br>Em breve os painéis vão aparecer neste espaço.</p>
    <div class="status"><span class="dot"></span> Servidor no ar · configuração em andamento</div>
    <div class="foot">© <span id="y"></span> Vitor Oliveira</div>
  </main>
  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
